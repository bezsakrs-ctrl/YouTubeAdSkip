name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnose Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not set}"
          if [ -d "$ANDROID_HOME" ]; then
            echo "--- SDK contents ---"
            ls "$ANDROID_HOME"
            echo "--- cmdline-tools ---"
            ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null || echo "no cmdline-tools dir"
            echo "--- platforms ---"
            ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "no platforms dir"
            echo "--- build-tools ---"
            ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "no build-tools dir"
          else
            echo "ANDROID_HOME directory does not exist"
          fi
          which sdkmanager 2>/dev/null && echo "sdkmanager found on PATH" || echo "sdkmanager not on PATH"

      - name: Install SDK components
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMGR" ]; then
            echo "sdkmanager not at latest, trying other paths..."
            for f in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -f "$f" ]; then SDKMGR="$f"; break; fi
            done
          fi
          echo "Using: $SDKMGR"
          yes | "$SDKMGR" --licenses
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeAutoSkip-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
